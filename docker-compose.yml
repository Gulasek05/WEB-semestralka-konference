services:
  web:
    build: .
    ports: ["8080:80"]
    volumes: [".:/var/www/html"]
    depends_on: [db]
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: konference
      MARIADB_USER: app
      MARIADB_PASSWORD: app
    volumes:
      - dbdata:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
  phpmyadmin:
    image: phpmyadmin
    ports: ["8081:80"]
    environment: { PMA_HOST: db }
volumes:
  dbdata: